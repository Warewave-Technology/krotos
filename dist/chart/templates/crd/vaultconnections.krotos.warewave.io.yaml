{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.22.0
  name: vaultconnections.krotos.warewave.io
spec:
  group: krotos.warewave.io
  names:
    kind: VaultConnection
    listKind: VaultConnectionList
    plural: vaultconnections
    shortNames:
    - vconn
    singular: vaultconnection
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.address
      name: Address
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: VaultConnection describes a Vault server and how the operator
          authenticates to it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: VaultConnectionSpec defines how the operator connects and
              authenticates to Vault.
            properties:
              address:
                description: address of the Vault server, e.g. https://vault.example.com:8200.
                pattern: ^https?://.+
                type: string
              auth:
                description: auth selects the authentication method. Exactly one method
                  must be set.
                properties:
                  kubernetes:
                    description: kubernetes authenticates with the operator's ServiceAccount
                      token.
                    properties:
                      audience:
                        description: |-
                          audience requested for the ServiceAccount token. Leave empty to use the
                          token mounted into the operator pod.
                        type: string
                      mountPath:
                        default: kubernetes
                        description: mountPath of the Kubernetes auth method.
                        type: string
                      role:
                        description: role is the Vault role to log in with.
                        minLength: 1
                        type: string
                    required:
                    - role
                    type: object
                  token:
                    description: token authenticates with a static token read from
                      a Secret.
                    properties:
                      secretRef:
                        description: secretRef references the Secret key holding the
                          Vault token.
                        properties:
                          key:
                            description: key inside the Secret.
                            minLength: 1
                            type: string
                          name:
                            description: name of the Secret.
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    required:
                    - secretRef
                    type: object
                type: object
                x-kubernetes-validations:
                - message: exactly one of kubernetes or token must be set
                  rule: '(has(self.kubernetes) ? 1 : 0) + (has(self.token) ? 1 : 0)
                    == 1'
              namespace:
                description: namespace is the Vault Enterprise namespace.
                type: string
              tls:
                description: tls configures the connection to Vault.
                properties:
                  caSecretRef:
                    description: caSecretRef references a PEM encoded CA bundle.
                    properties:
                      key:
                        description: key inside the Secret.
                        minLength: 1
                        type: string
                      name:
                        description: name of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  insecureSkipVerify:
                    description: insecureSkipVerify disables certificate verification.
                      Do not use in production.
                    type: boolean
                type: object
            required:
            - address
            - auth
            type: object
          status:
            description: VaultConnectionStatus defines the observed state of VaultConnection.
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the connection. The "Ready"
                  condition is true when login to Vault succeeds.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastCheckedTime:
                description: lastCheckedTime is when the connection was last verified.
                format: date-time
                type: string
              observedGeneration:
                description: observedGeneration is the last spec generation that was
                  reconciled.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
