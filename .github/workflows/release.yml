name: Release

# Publishes a release when a version tag (v1.2.3) is pushed:
# - the multi-arch image to ghcr.io/warewave-technology/krotos,
# - the Helm chart to oci://ghcr.io/warewave-technology/charts/krotos,
# - a GitHub Release with the chart package and a single-file install.yaml.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions: {}

env:
  IMAGE: ghcr.io/warewave-technology/krotos
  CHART_REPO: oci://ghcr.io/warewave-technology/charts

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: make test

  release:
    name: Publish
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
      packages: write   # push the image and the chart to ghcr.io
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          # A hyphen (v1.2.3-rc.1) marks a pre-release.
          if [[ "${TAG}" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # 1.2.3 and 1.2 for every release, latest only for stable ones.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.version.outputs.prerelease == 'false' }}
          flavor: |
            latest=${{ steps.version.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=krotos
            org.opencontainers.image.description=Kubernetes operator that rotates database passwords stored in HashiCorp Vault
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Package the Helm chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          helm package dist/chart --version "$VERSION" --app-version "$VERSION" --destination release
          helm lint "release/krotos-${VERSION}.tgz"

      - name: Push the Helm chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GH_ACTOR" --password-stdin
          helm push "release/krotos-${VERSION}.tgz" "$CHART_REPO"

      - name: Build install.yaml
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          make build-installer IMG="${IMAGE}:${VERSION}"
          cp dist/install.yaml release/install.yaml

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          notes="docs/release-notes/${TAG}.md"
          args=(--title "krotos ${TAG}" --verify-tag)
          if [ -f "$notes" ]; then args+=(--notes-file "$notes"); else args+=(--generate-notes); fi
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$TAG" release/* "${args[@]}"
