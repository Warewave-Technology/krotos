# Demo applications and rotations in team-a, one per engine.
apiVersion: krotos.warewave.io/v1alpha1
kind: VaultConnection
metadata:
  name: main-vault
  namespace: team-a
spec:
  address: http://vault.krotos-deps.svc:8200
  auth:
    kubernetes:
      role: krotos
---
# orders: PostgreSQL; the application reads Vault directly (Vault Agent / CSI style).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: team-a
spec:
  replicas: 2
  selector:
    matchLabels: {app: orders-api}
  template:
    metadata:
      labels: {app: orders-api}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
      - name: app
        image: busybox:1.37
        command: ["sh", "-c", "echo started $(date); sleep 1000000"]
---
apiVersion: krotos.warewave.io/v1alpha1
kind: DatabaseCredentialRotation
metadata:
  name: orders
  namespace: team-a
spec:
  engine: postgresql
  database:
    host: postgres.krotos-deps.svc
    port: 5432
    database: orders
    tls: {mode: disable}
  masterCredentials:
    vault: {connectionRef: main-vault, path: db/postgres/master}
  target:
    username: orders_app
    vault: {connectionRef: main-vault, path: apps/orders/db, usernameKey: username}
  schedule: {every: 30d}
  # All day, every day, so manual triggers work any time.
  window: {timezone: UTC, start: "00:00", duration: 24h}
  restartTargets:
  - {kind: Deployment, name: orders-api}
---
# billing: MySQL; External Secrets Operator writes the Secret billing-db.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-api
  namespace: team-a
spec:
  replicas: 1
  selector:
    matchLabels: {app: billing-api}
  template:
    metadata:
      labels: {app: billing-api}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
      - name: app
        image: busybox:1.37
        command: ["sh", "-c", "echo started $(date); sleep 1000000"]
        envFrom: [{secretRef: {name: billing-db}}]
---
apiVersion: krotos.warewave.io/v1alpha1
kind: DatabaseCredentialRotation
metadata:
  name: billing
  namespace: team-a
spec:
  engine: mysql
  database:
    host: mysql.krotos-deps.svc
    port: 3306
    database: billing
    tls: {mode: require}
  masterCredentials:
    vault: {connectionRef: main-vault, path: db/mysql/master}
  target:
    username: billing_app
    mysqlHost: "%"
    vault: {connectionRef: main-vault, path: apps/billing/db}
  # Daily at 03:00 UTC; trigger earlier with the rotate-now annotation.
  schedule: {cron: "0 3 * * *"}
  window: {timezone: UTC, start: "00:00", duration: 24h}
  secretSync:
    type: ExternalSecret
    externalSecret: {name: billing-db, secretName: billing-db}
    timeout: 3m
  restartTargets:
  - {kind: Deployment, name: billing-api}
---
# analytics: ClickHouse; Vault Secrets Operator writes the Secret analytics-db.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-api
  namespace: team-a
spec:
  replicas: 1
  selector:
    matchLabels: {app: analytics-api}
  template:
    metadata:
      labels: {app: analytics-api}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
      - name: app
        image: busybox:1.37
        command: ["sh", "-c", "echo started $(date); sleep 1000000"]
        envFrom: [{secretRef: {name: analytics-db}}]
---
apiVersion: krotos.warewave.io/v1alpha1
kind: DatabaseCredentialRotation
metadata:
  name: analytics
  namespace: team-a
spec:
  engine: clickhouse
  database:
    host: clickhouse.krotos-deps.svc
    port: 9000
    database: analytics
    tls: {mode: disable}
    clickhouse: {protocol: native}
  masterCredentials:
    vault: {connectionRef: main-vault, path: db/clickhouse/master}
  target:
    username: analytics_reader
    vault: {connectionRef: main-vault, path: apps/analytics/db}
  schedule: {every: 7d}
  window: {timezone: UTC, start: "00:00", duration: 24h}
  secretSync:
    type: VaultStaticSecret
    vaultStaticSecret: {name: analytics-db, secretName: analytics-db}
    timeout: 3m
  restartTargets:
  - {kind: Deployment, name: analytics-api}
---
# sessions: Redis primary + replica; the master user is the least-privilege rotator
# from docs/least-privilege/redis.acl. External Secrets Operator writes sessions-redis.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sessions-api
  namespace: team-a
spec:
  replicas: 1
  selector:
    matchLabels: {app: sessions-api}
  template:
    metadata:
      labels: {app: sessions-api}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
      - name: app
        image: busybox:1.37
        command: ["sh", "-c", "echo started $(date); sleep 1000000"]
        envFrom: [{secretRef: {name: sessions-redis}}]
---
apiVersion: krotos.warewave.io/v1alpha1
kind: DatabaseCredentialRotation
metadata:
  name: sessions
  namespace: team-a
spec:
  engine: redis
  database:
    host: redis-primary.krotos-deps.svc
    port: 6379
    tls: {mode: disable}
    redis:
      persistence: Auto
      nodes: [redis-replica.krotos-deps.svc:6379]
  masterCredentials:
    vault: {connectionRef: main-vault, path: db/redis/rotator}
  target:
    username: sessions_app
    vault: {connectionRef: main-vault, path: apps/sessions/redis}
  schedule: {every: 7d}
  window: {timezone: UTC, start: "00:00", duration: 24h}
  secretSync:
    type: ExternalSecret
    externalSecret: {name: sessions-redis, secretName: sessions-redis}
    timeout: 3m
  restartTargets:
  - {kind: Deployment, name: sessions-api}
---
# events: NATS in operator mode; krotos signs with the scoped key from
# docs/least-privilege/nats.sh. Vault Secrets Operator writes events-nats, which the
# application mounts as its .creds file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: events-api
  namespace: team-a
spec:
  replicas: 1
  selector:
    matchLabels: {app: events-api}
  template:
    metadata:
      labels: {app: events-api}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
      - name: app
        image: natsio/nats-box:0.20.0
        command: ["nats", "sub", "events.>", "--creds", "/creds/user.creds", "-s", "nats://nats.krotos-deps.svc:4222"]
        volumeMounts: [{name: creds, mountPath: /creds, readOnly: true}]
      volumes:
      - name: creds
        secret:
          secretName: events-nats
          items: [{key: creds, path: user.creds}]
---
apiVersion: krotos.warewave.io/v1alpha1
kind: DatabaseCredentialRotation
metadata:
  name: events
  namespace: team-a
spec:
  engine: nats
  database:
    host: nats.krotos-deps.svc
    port: 4222
    tls: {mode: disable}
    nats: {credentialsTTL: 720h}
  masterCredentials:
    vault: {connectionRef: main-vault, path: db/nats/events-signing-key, passwordKey: seed}
  target:
    username: events-service
    vault: {connectionRef: main-vault, path: apps/events/nats, passwordKey: creds}
  schedule: {every: 7d}
  window: {timezone: UTC, start: "00:00", duration: 24h}
  secretSync:
    type: VaultStaticSecret
    vaultStaticSecret: {name: events-nats, secretName: events-nats}
    timeout: 3m
  restartTargets:
  - {kind: Deployment, name: events-api}
