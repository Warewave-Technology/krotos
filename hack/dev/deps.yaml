# Development dependencies: Vault (dev mode) and servers for every supported engine.
# Credentials here are throwaway values for a local Kind cluster only.
apiVersion: v1
kind: Namespace
metadata:
  name: krotos-deps
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: krotos-deps
---
# Lets Vault review the operator's ServiceAccount tokens (Kubernetes auth).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: krotos-dev-vault-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
- kind: ServiceAccount
  name: vault
  namespace: krotos-deps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: krotos-deps
spec:
  selector:
    matchLabels: {app: vault}
  template:
    metadata:
      labels: {app: vault}
    spec:
      serviceAccountName: vault
      containers:
      - name: vault
        image: hashicorp/vault:1.20
        args: ["server", "-dev", "-dev-root-token-id=root", "-dev-listen-address=0.0.0.0:8200"]
        env:
        - {name: VAULT_ADDR, value: "http://127.0.0.1:8200"}
        - {name: VAULT_TOKEN, value: root}
        ports: [{containerPort: 8200}]
        readinessProbe:
          httpGet: {path: /v1/sys/health, port: 8200}
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: krotos-deps
spec:
  selector: {app: vault}
  ports: [{port: 8200}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: krotos-deps
spec:
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
      - name: postgres
        image: postgres:17-alpine
        env:
        - {name: POSTGRES_USER, value: postgres}
        - {name: POSTGRES_PASSWORD, value: postgres-master-pw}
        - {name: POSTGRES_DB, value: orders}
        ports: [{containerPort: 5432}]
        readinessProbe:
          exec: {command: ["pg_isready", "-U", "postgres", "-d", "orders"]}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: krotos-deps
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: krotos-deps
spec:
  selector:
    matchLabels: {app: mysql}
  template:
    metadata:
      labels: {app: mysql}
    spec:
      containers:
      - name: mysql
        image: mysql:8.4
        env:
        - {name: MYSQL_ROOT_PASSWORD, value: mysql-root-pw}
        - {name: MYSQL_DATABASE, value: billing}
        ports: [{containerPort: 3306}]
        readinessProbe:
          exec: {command: ["mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pmysql-root-pw"]}
          initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: krotos-deps
spec:
  selector: {app: mysql}
  ports: [{port: 3306}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse
  namespace: krotos-deps
spec:
  selector:
    matchLabels: {app: clickhouse}
  template:
    metadata:
      labels: {app: clickhouse}
    spec:
      containers:
      - name: clickhouse
        image: clickhouse/clickhouse-server:25.8
        env:
        - {name: CLICKHOUSE_USER, value: admin}
        - {name: CLICKHOUSE_PASSWORD, value: clickhouse-admin-pw}
        - {name: CLICKHOUSE_DB, value: analytics}
        # Lets the admin user manage users with SQL; only such users can be rotated.
        - {name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT, value: "1"}
        ports: [{containerPort: 9000}, {containerPort: 8123}]
        readinessProbe:
          httpGet: {path: /ping, port: 8123}
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: krotos-deps
spec:
  selector: {app: clickhouse}
  ports:
  - {name: native, port: 9000}
  - {name: http, port: 8123}
---
# Redis primary and replica. Both keep their users in an aclfile, so krotos persists
# changes with ACL SAVE (persistence Auto). ACL changes are not replicated: the
# rotation lists the replica in database.redis.nodes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-primary
  namespace: krotos-deps
spec:
  selector:
    matchLabels: {app: redis-primary}
  template:
    metadata:
      labels: {app: redis-primary}
    spec:
      containers:
      - name: redis
        image: redis:8.2-alpine
        command:
        - sh
        - -c
        - |
          [ -f /data/users.acl ] || echo 'user default on >redis-admin-pw ~* &* +@all' > /data/users.acl
          exec redis-server --aclfile /data/users.acl
        ports: [{containerPort: 6379}]
        readinessProbe:
          exec: {command: ["redis-cli", "--no-auth-warning", "-a", "redis-admin-pw", "ping"]}
        volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: redis-primary
  namespace: krotos-deps
spec:
  selector: {app: redis-primary}
  ports: [{port: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-replica
  namespace: krotos-deps
spec:
  selector:
    matchLabels: {app: redis-replica}
  template:
    metadata:
      labels: {app: redis-replica}
    spec:
      containers:
      - name: redis
        image: redis:8.2-alpine
        command:
        - sh
        - -c
        - |
          [ -f /data/users.acl ] || echo 'user default on >redis-admin-pw ~* &* +@all' > /data/users.acl
          exec redis-server --aclfile /data/users.acl \
            --replicaof redis-primary.krotos-deps.svc 6379 --masteruser default --masterauth redis-admin-pw
        ports: [{containerPort: 6379}]
        readinessProbe:
          exec: {command: ["redis-cli", "--no-auth-warning", "-a", "redis-admin-pw", "ping"]}
        volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: redis-replica
  namespace: krotos-deps
spec:
  selector: {app: redis-replica}
  ports: [{port: 6379}]
---
# nsc's store (operator, accounts, keys) for the NATS demo. hack/dev/up.sh runs nsc
# here: it creates the operator once and pushes the accounts on every run.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nsc-store
  namespace: krotos-deps
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 100Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats-box
  namespace: krotos-deps
spec:
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: nats-box}
  template:
    metadata:
      labels: {app: nats-box}
    spec:
      containers:
      - name: nats-box
        image: natsio/nats-box:0.20.0
        command: ["sleep", "infinity"]
        env:
        - {name: NKEYS_PATH, value: /store/keys}
        - {name: NSC_HOME, value: /store/nsc}
        volumeMounts: [{name: store, mountPath: /store}]
      volumes:
      - name: store
        persistentVolumeClaim: {claimName: nsc-store}
