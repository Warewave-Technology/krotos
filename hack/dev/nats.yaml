# NATS in operator (JWT/NKey) mode with the full resolver. The ConfigMap nats-config
# is generated by nsc in hack/dev/up.sh; accounts are pushed after the server starts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: krotos-deps
spec:
  selector:
    matchLabels: {app: nats}
  template:
    metadata:
      labels: {app: nats}
    spec:
      containers:
      - name: nats
        image: nats:2.12-alpine
        args: ["-c", "/etc/nats/server.conf", "-m", "8222"]
        ports: [{containerPort: 4222}, {containerPort: 8222}]
        readinessProbe:
          httpGet: {path: /healthz, port: 8222}
        volumeMounts:
        - {name: config, mountPath: /etc/nats}
        - {name: jwt, mountPath: /data/jwt}
      volumes:
      - name: config
        configMap: {name: nats-config}
      - name: jwt
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: krotos-deps
spec:
  selector: {app: nats}
  ports: [{port: 4222}]
