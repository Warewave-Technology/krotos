# This rule is not used by the project krotos itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the krotos.warewave.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: krotos
    app.kubernetes.io/managed-by: kustomize
  name: databasecredentialrotation-editor-role
rules:
- apiGroups:
  - krotos.warewave.io
  resources:
  - databasecredentialrotations
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - krotos.warewave.io
  resources:
  - databasecredentialrotations/status
  verbs:
  - get
