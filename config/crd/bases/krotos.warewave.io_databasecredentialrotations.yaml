---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: databasecredentialrotations.krotos.warewave.io
spec:
  group: krotos.warewave.io
  names:
    kind: DatabaseCredentialRotation
    listKind: DatabaseCredentialRotationList
    plural: databasecredentialrotations
    shortNames:
    - dcr
    singular: databasecredentialrotation
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.engine
      name: Engine
      type: string
    - jsonPath: .spec.target.username
      name: User
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.lastRotationTime
      name: Last Rotation
      type: date
    - jsonPath: .status.nextScheduledTime
      name: Next
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DatabaseCredentialRotation periodically rotates a database user's password
          stored in Vault and restarts the workloads using it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DatabaseCredentialRotationSpec defines the desired state
              of DatabaseCredentialRotation.
            properties:
              database:
                description: database describes how to reach the database server.
                properties:
                  clickhouse:
                    description: clickhouse holds ClickHouse specific settings.
                    properties:
                      cluster:
                        description: cluster name. When set, statements are executed
                          with ON CLUSTER.
                        type: string
                      protocol:
                        default: native
                        description: protocol used to connect.
                        enum:
                        - native
                        - http
                        type: string
                    type: object
                  database:
                    description: database to connect to. Required by PostgreSQL, optional
                      for the others.
                    type: string
                  host:
                    description: host name or IP address of the database server.
                    minLength: 1
                    type: string
                  port:
                    description: port of the database server.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  tls:
                    default:
                      mode: require
                    description: |-
                      tls configures the connection to the database. Defaults to mode "require";
                      set mode "disable" explicitly for unencrypted connections.
                    properties:
                      caSecretRef:
                        description: caSecretRef references a PEM encoded CA bundle.
                        properties:
                          key:
                            description: key inside the Secret.
                            minLength: 1
                            type: string
                          name:
                            description: name of the Secret.
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      mode:
                        default: require
                        description: mode of TLS usage.
                        enum:
                        - disable
                        - require
                        - verify-ca
                        - verify-full
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: caSecretRef is required for verify-ca and verify-full
                      rule: '!(self.mode in [''verify-ca'', ''verify-full'']) || has(self.caSecretRef)'
                required:
                - host
                - port
                type: object
              engine:
                description: engine of the target database.
                enum:
                - postgresql
                - mysql
                - clickhouse
                type: string
              masterCredentials:
                description: masterCredentials are used to change the target user's
                  password.
                properties:
                  secretRef:
                    description: secretRef reads the master credentials from a Secret.
                    properties:
                      name:
                        description: name of the Secret.
                        minLength: 1
                        type: string
                      passwordKey:
                        default: password
                        description: passwordKey is the key holding the password.
                        type: string
                      usernameKey:
                        default: username
                        description: usernameKey is the key holding the username.
                        type: string
                    required:
                    - name
                    type: object
                  vault:
                    description: vault reads the master credentials from Vault.
                    properties:
                      connectionRef:
                        description: connectionRef is the name of a VaultConnection
                          in the same namespace.
                        minLength: 1
                        type: string
                      kvVersion:
                        default: 2
                        description: kvVersion is the version of the KV secrets engine.
                        enum:
                        - 1
                        - 2
                        format: int32
                        type: integer
                      mount:
                        default: secret
                        description: mount is the KV secrets engine mount path, e.g.
                          "secret".
                        minLength: 1
                        type: string
                      passwordKey:
                        default: password
                        description: passwordKey is the key holding the password.
                        type: string
                      path:
                        description: |-
                          path of the secret inside the mount, without the "data/" prefix for KV v2,
                          e.g. "apps/orders/db".
                        minLength: 1
                        type: string
                      usernameKey:
                        default: username
                        description: usernameKey is the key holding the username.
                        type: string
                    required:
                    - connectionRef
                    - path
                    type: object
                type: object
                x-kubernetes-validations:
                - message: exactly one of vault or secretRef must be set
                  rule: '(has(self.vault) ? 1 : 0) + (has(self.secretRef) ? 1 : 0)
                    == 1'
              passwordPolicy:
                default: {}
                description: passwordPolicy controls generated passwords.
                properties:
                  excludeCharacters:
                    description: |-
                      excludeCharacters are never used in generated passwords. When empty,
                      DefaultExcludeCharacters is used.
                    type: string
                  length:
                    default: 32
                    description: length of the generated password.
                    format: int32
                    maximum: 128
                    minimum: 16
                    type: integer
                type: object
              restartTargets:
                description: restartTargets are workloads restarted after the new
                  password is in place.
                items:
                  description: RestartTarget selects workloads to restart. Exactly
                    one of name or selector must be set.
                  properties:
                    kind:
                      description: kind of the workload.
                      enum:
                      - Deployment
                      - StatefulSet
                      - DaemonSet
                      type: string
                    name:
                      description: name of a single workload.
                      type: string
                    selector:
                      description: selector matches workloads by label.
                      properties:
                        matchExpressions:
                          description: matchExpressions is a list of label selector
                            requirements. The requirements are ANDed.
                          items:
                            description: |-
                              A label selector requirement is a selector that contains values, a key, and an operator that
                              relates the key and values.
                            properties:
                              key:
                                description: key is the label key that the selector
                                  applies to.
                                type: string
                              operator:
                                description: |-
                                  operator represents a key's relationship to a set of values.
                                  Valid operators are In, NotIn, Exists and DoesNotExist.
                                type: string
                              values:
                                description: |-
                                  values is an array of string values. If the operator is In or NotIn,
                                  the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                  the values array must be empty. This array is replaced during a strategic
                                  merge patch.
                                items:
                                  type: string
                                type: array
                                x-kubernetes-list-type: atomic
                            required:
                            - key
                            - operator
                            type: object
                          type: array
                          x-kubernetes-list-type: atomic
                        matchLabels:
                          additionalProperties:
                            type: string
                          description: |-
                            matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                            map is equivalent to an element of matchExpressions, whose key field is "key", the
                            operator is "In", and the values array contains only "value". The requirements are ANDed.
                          type: object
                      type: object
                      x-kubernetes-map-type: atomic
                  required:
                  - kind
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one of name or selector must be set
                    rule: '(has(self.name) ? 1 : 0) + (has(self.selector) ? 1 : 0)
                      == 1'
                maxItems: 32
                type: array
                x-kubernetes-list-type: atomic
              rolloutTimeout:
                default: 10m
                description: rolloutTimeout is how long to wait for restarted workloads
                  to become ready.
                type: string
              schedule:
                description: schedule defines when a rotation becomes due.
                properties:
                  cron:
                    description: cron expression (5 fields) evaluated in the window's
                      time zone.
                    minLength: 1
                    type: string
                  every:
                    description: every is the interval between successful rotations,
                      in days ("30d") or hours ("12h").
                    pattern: ^[1-9][0-9]*(d|h)$
                    type: string
                type: object
                x-kubernetes-validations:
                - message: exactly one of cron or every must be set
                  rule: '(has(self.cron) ? 1 : 0) + (has(self.every) ? 1 : 0) == 1'
              secretSync:
                default:
                  type: None
                description: |-
                  secretSync describes how applications receive the password from Vault, and
                  what has to happen before they are restarted.
                properties:
                  externalSecret:
                    description: externalSecret is the ExternalSecret to force-sync.
                    properties:
                      name:
                        description: name of the ExternalSecret / VaultStaticSecret.
                        minLength: 1
                        type: string
                      secretKey:
                        default: password
                        description: secretKey is the key in secretName that holds
                          the password.
                        type: string
                      secretName:
                        description: secretName is the Secret produced by the sync
                          resource.
                        minLength: 1
                        type: string
                    required:
                    - name
                    - secretName
                    type: object
                  timeout:
                    default: 5m
                    description: timeout for the synced Secret to contain the new
                      password.
                    type: string
                  type:
                    default: None
                    description: type of the sync mechanism.
                    enum:
                    - None
                    - ExternalSecret
                    - VaultStaticSecret
                    type: string
                  vaultStaticSecret:
                    description: vaultStaticSecret is the VaultStaticSecret to refresh.
                    properties:
                      name:
                        description: name of the ExternalSecret / VaultStaticSecret.
                        minLength: 1
                        type: string
                      secretKey:
                        default: password
                        description: secretKey is the key in secretName that holds
                          the password.
                        type: string
                      secretName:
                        description: secretName is the Secret produced by the sync
                          resource.
                        minLength: 1
                        type: string
                    required:
                    - name
                    - secretName
                    type: object
                type: object
                x-kubernetes-validations:
                - message: externalSecret is required when type is ExternalSecret
                  rule: self.type != 'ExternalSecret' || has(self.externalSecret)
                - message: vaultStaticSecret is required when type is VaultStaticSecret
                  rule: self.type != 'VaultStaticSecret' || has(self.vaultStaticSecret)
                - message: externalSecret is only allowed when type is ExternalSecret
                  rule: self.type == 'ExternalSecret' || !has(self.externalSecret)
                - message: vaultStaticSecret is only allowed when type is VaultStaticSecret
                  rule: self.type == 'VaultStaticSecret' || !has(self.vaultStaticSecret)
              suspend:
                description: suspend stops scheduling new rotations. A rotation already
                  in progress is finished.
                type: boolean
              target:
                description: target is the database user whose password is rotated.
                properties:
                  mysqlHost:
                    description: mysqlHost is the host part of the MySQL account ('user'@'host').
                      Defaults to "%".
                    type: string
                  username:
                    description: username of the database user.
                    minLength: 1
                    type: string
                  vault:
                    description: |-
                      vault is where the password is read from and written back to. The
                      VaultConnection used here needs write access to the path.
                    properties:
                      connectionRef:
                        description: connectionRef is the name of a VaultConnection
                          in the same namespace.
                        minLength: 1
                        type: string
                      kvVersion:
                        default: 2
                        description: kvVersion is the version of the KV secrets engine.
                        enum:
                        - 1
                        - 2
                        format: int32
                        type: integer
                      mount:
                        default: secret
                        description: mount is the KV secrets engine mount path, e.g.
                          "secret".
                        minLength: 1
                        type: string
                      passwordKey:
                        default: password
                        description: passwordKey is the key the password is written
                          to.
                        type: string
                      path:
                        description: |-
                          path of the secret inside the mount, without the "data/" prefix for KV v2,
                          e.g. "apps/orders/db".
                        minLength: 1
                        type: string
                      pendingPath:
                        description: |-
                          pendingPath is where the in-flight rotation's old and new passwords are kept
                          (same mount and KV version as the target) until it finishes, so a restarted
                          operator can resume or roll back. All versions are destroyed afterwards.
                          Defaults to "krotos/pending/<namespace>/<name>".
                        minLength: 1
                        type: string
                      usernameKey:
                        description: usernameKey, when set, is kept up to date with
                          the username as well.
                        type: string
                    required:
                    - connectionRef
                    - path
                    type: object
                required:
                - username
                - vault
                type: object
              window:
                description: window is the change window. A due rotation only starts
                  inside the window.
                properties:
                  days:
                    description: days the window opens on. Empty means every day.
                    items:
                      description: Weekday is a day of the week.
                      enum:
                      - Mon
                      - Tue
                      - Wed
                      - Thu
                      - Fri
                      - Sat
                      - Sun
                      type: string
                    maxItems: 7
                    type: array
                    x-kubernetes-list-type: set
                  duration:
                    description: duration of the window, at most 24h.
                    type: string
                  minRemaining:
                    default: 15m
                    description: |-
                      minRemaining is the minimum time left in the window for a rotation to start.
                      A rotation that already started is always finished, even after the window closes.
                    type: string
                  start:
                    description: start is the local opening time in HH:MM format.
                    pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                    type: string
                  timezone:
                    default: UTC
                    description: timezone is an IANA time zone name, e.g. "Europe/Istanbul".
                    type: string
                required:
                - duration
                - start
                type: object
                x-kubernetes-validations:
                - message: duration must be greater than 0 and at most 24h
                  rule: duration(self.duration) > duration('0s') && duration(self.duration)
                    <= duration('24h')
                - message: minRemaining must be at least 0 and shorter than duration
                  rule: '!has(self.minRemaining) || (duration(self.minRemaining) >=
                    duration(''0s'') && duration(self.minRemaining) < duration(self.duration))'
            required:
            - database
            - engine
            - masterCredentials
            - schedule
            - target
            - window
            type: object
            x-kubernetes-validations:
            - message: database.clickhouse is only allowed when engine is clickhouse
              rule: '!has(self.database.clickhouse) || self.engine == ''clickhouse'''
            - message: target.mysqlHost is only allowed when engine is mysql
              rule: '!has(self.target.mysqlHost) || self.engine == ''mysql'''
          status:
            description: DatabaseCredentialRotationStatus defines the observed state
              of DatabaseCredentialRotation.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              consecutiveFailures:
                description: consecutiveFailures counts failed attempts since the
                  last success.
                format: int32
                type: integer
              lastAttemptTime:
                description: lastAttemptTime is when the last rotation started.
                format: date-time
                type: string
              lastRotationTime:
                description: lastRotationTime is when the last rotation completed
                  successfully.
                format: date-time
                type: string
              message:
                description: message is a human readable description of the current
                  state. Never contains secrets.
                type: string
              nextScheduledTime:
                description: nextScheduledTime is when the next rotation becomes due.
                format: date-time
                type: string
              nextWindowStart:
                description: nextWindowStart is when the next change window opens.
                format: date-time
                type: string
              observedGeneration:
                description: observedGeneration is the last spec generation that was
                  reconciled.
                format: int64
                type: integer
              phase:
                description: phase is the coarse state of the rotation.
                enum:
                - Idle
                - Waiting
                - Rotating
                - Restarting
                - Failed
                type: string
              retries:
                description: retries counts failed attempts of the current step.
                format: int32
                type: integer
              rolloutStartTime:
                description: rolloutStartTime is when the workload restarts of the
                  in-flight rotation began.
                format: date-time
                type: string
              secretSyncStartTime:
                description: |-
                  secretSyncStartTime is when the in-flight rotation asked the sync operator
                  (ExternalSecret / VaultStaticSecret) to copy the new password.
                format: date-time
                type: string
              step:
                description: step is the last completed step of the in-flight rotation.
                  Empty when idle.
                enum:
                - ""
                - PendingSaved
                - DbUpdated
                - Verified
                - VaultWritten
                - SecretSynced
                - RollingBack
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
