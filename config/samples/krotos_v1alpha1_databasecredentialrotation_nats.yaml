# NATS user in JWT/NKey (operator) mode.
#
# The rotated value is the user's .creds file (JWT + NKey seed). NATS keeps no users
# on the server: krotos issues a new user with the same name and claims, signed by
# the account signing key below, and the old credentials stop working when they
# expire. credentialsTTL must be at least twice the longest time between two
# rotations (here: 7 days -> at least 14 days).
# The signing key can be created from docs/least-privilege/nats.sh.
apiVersion: krotos.warewave.io/v1alpha1
kind: DatabaseCredentialRotation
metadata:
  name: orders-events
spec:
  engine: nats
  database:
    host: nats.messaging.svc
    port: 4222
    tls:
      mode: verify-full
      caSecretRef:
        name: nats-ca
        key: ca.crt
    nats:
      credentialsTTL: 720h
  masterCredentials:
    vault:
      connectionRef: main-vault
      path: nats/orders/signing-key
      # The account signing key's seed (SA...); no username is needed.
      passwordKey: seed
  target:
    # Must match the name in the current credentials' JWT.
    username: orders-service
    vault:
      connectionRef: main-vault
      path: apps/orders/nats
      passwordKey: creds
  schedule:
    every: 7d
  window:
    timezone: UTC
    start: "01:00"
    duration: 2h
  restartTargets:
  - kind: Deployment
    name: orders-api
