# MySQL / MariaDB with External Secrets Operator.
#
# The master credentials come from a Kubernetes Secret:
#   kubectl create secret generic billing-mysql-master \
#     --from-literal=user=root --from-literal=pass=<password>
#
# Applications get the password from the Secret "billing-db", which the
# ExternalSecret "billing-db" fills from Vault. The operator triggers that sync and
# restarts only after the Secret holds the new password.
apiVersion: krotos.warewave.io/v1alpha1
kind: DatabaseCredentialRotation
metadata:
  name: billing-app
spec:
  engine: mysql
  database:
    host: billing-mysql.databases.svc
    port: 3306
    database: billing
    # tls defaults to {mode: require}

  masterCredentials:
    secretRef:
      name: billing-mysql-master
      usernameKey: user
      passwordKey: pass

  target:
    username: billing_app
    # Host part of the account: 'billing_app'@'10.0.%'. Default: %
    mysqlHost: "10.0.%"
    vault:
      connectionRef: main-vault
      path: apps/billing/db

  # Every Sunday at 03:00 Istanbul time.
  schedule:
    cron: "0 3 * * 0"
  window:
    timezone: Europe/Istanbul
    days: [Sun]
    start: "02:30"
    duration: 2h

  secretSync:
    type: ExternalSecret
    externalSecret:
      name: billing-db        # the ExternalSecret
      secretName: billing-db  # the Secret it writes
      secretKey: password     # must hold the plain password, default: password
    # Without a sync in time the rotation completes as Degraded and nothing is restarted.
    timeout: 5m

  restartTargets:
  - kind: Deployment
    name: billing-api
  - kind: Deployment
    name: billing-worker
