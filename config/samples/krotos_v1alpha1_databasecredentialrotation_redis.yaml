# Redis / Valkey ACL user, on a primary with one replica.
#
# ACL changes are not replicated, so every server is listed: the password is changed,
# persisted and verified on database.host and on each node. The servers use an aclfile,
# so the default persistence (Auto) runs ACL SAVE and the change survives restarts.
# The master user can be created from docs/least-privilege/redis.acl.
apiVersion: krotos.warewave.io/v1alpha1
kind: DatabaseCredentialRotation
metadata:
  name: sessions-cache
spec:
  engine: redis
  database:
    host: redis-0.redis.cache.svc
    port: 6379
    tls:
      mode: disable
    redis:
      # Auto (default): ACL SAVE when the server has an aclfile, otherwise refuse.
      # ConfigRewrite: CONFIG REWRITE (rewrites the whole config file).
      # None: keep the change in memory only.
      persistence: Auto
      nodes:
      - redis-1.redis.cache.svc:6379
  masterCredentials:
    vault:
      connectionRef: main-vault
      path: db/redis/rotator
  target:
    # Use "default" for a server that only has requirepass.
    username: sessions_app
    vault:
      connectionRef: main-vault
      path: apps/sessions/redis
  schedule:
    every: 7d
  window:
    timezone: UTC
    start: "01:00"
    duration: 2h
  restartTargets:
  - kind: Deployment
    name: sessions-api
