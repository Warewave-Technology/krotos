# ClickHouse on a cluster, with Vault Secrets Operator.
#
# Only users managed by SQL (access_management) can be rotated, not users.xml users.
# The master credentials and the rotated password live behind different Vault
# connections: one that can only read the master, one that can write the target.
apiVersion: krotos.warewave.io/v1alpha1
kind: DatabaseCredentialRotation
metadata:
  name: analytics-reader
spec:
  engine: clickhouse
  database:
    host: clickhouse.analytics.svc
    port: 8443
    database: default
    tls:
      mode: verify-ca   # chain only, not the host name
      caSecretRef:
        name: clickhouse-ca
        key: ca.crt
    clickhouse:
      # ALTER USER ... ON CLUSTER main; omit for replicated access storage.
      cluster: main
      # native (default) | http
      protocol: http

  masterCredentials:
    vault:
      connectionRef: token-vault
      path: db/clickhouse/admin

  target:
    username: analytics_reader
    vault:
      connectionRef: main-vault
      mount: kv
      path: apps/analytics/clickhouse
      kvVersion: 1

  passwordPolicy:
    length: 48

  schedule:
    every: 7d
  window:
    timezone: UTC
    start: "23:00"      # windows may cross midnight: 23:00-01:00
    duration: 2h
    minRemaining: 30m

  secretSync:
    type: VaultStaticSecret
    vaultStaticSecret:
      name: analytics-clickhouse
      secretName: analytics-clickhouse
    timeout: 3m

  restartTargets:
  - kind: Deployment
    selector:
      matchExpressions:
      - {key: app, operator: In, values: [dashboard, reporter]}
  rolloutTimeout: 15m
