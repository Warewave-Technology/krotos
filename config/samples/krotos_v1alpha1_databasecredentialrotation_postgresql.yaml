# PostgreSQL, full reference: every field is shown, with defaults where they exist.
#
# Rotates the password of "orders_app" every 30 days, inside the weekend change
# window, then restarts the workloads that use it. Applications read Vault
# directly (Vault Agent / CSI), so no secret sync is needed.
apiVersion: krotos.warewave.io/v1alpha1
kind: DatabaseCredentialRotation
metadata:
  name: orders-app
  # One-shot triggers, removed by the operator after the attempt:
  # annotations:
  #   krotos.warewave.io/rotate-now: "true"      # make it due now (still waits for the window)
  #   krotos.warewave.io/ignore-window: "true"   # start even outside the window
spec:
  # postgresql | mysql | clickhouse
  engine: postgresql
  # true: no new rotations are started; one in progress is finished.
  suspend: false

  database:
    host: orders-pg.databases.svc
    port: 5432
    # The target user must be able to log in to this database (logins are verified).
    database: orders
    tls:
      # disable | require (default) | verify-ca | verify-full
      mode: verify-full
      # Required for verify-ca and verify-full.
      caSecretRef:
        name: orders-pg-ca
        key: ca.crt

  # The privileged user that changes the password. Exactly one of vault or secretRef.
  masterCredentials:
    vault:
      connectionRef: main-vault
      mount: secret          # default: secret
      path: db/orders/master # inside the mount, without "data/"
      kvVersion: 2           # 1 | 2, default: 2
      usernameKey: username  # default: username
      passwordKey: password  # default: password

  # The user whose password is rotated, and where its password lives in Vault.
  target:
    username: orders_app
    vault:
      # Needs read + write on path, and on pendingPath (see README "Vault setup").
      connectionRef: main-vault
      mount: secret
      path: apps/orders/db
      kvVersion: 2
      passwordKey: password
      # Optional: also keep the username in the secret up to date.
      usernameKey: username
      # Where the old and new passwords are kept while a rotation is in progress;
      # destroyed afterwards. Default: krotos/pending/<namespace>/<name>
      pendingPath: krotos/pending/team-a/orders-app

  passwordPolicy:
    # 16-128, default: 32
    length: 32
    # Never used in passwords. Default: ' " \ ` $ @ : / ? # % &
    excludeCharacters: "'\"\\`$@:/?#%&"

  # Exactly one of cron or every.
  schedule:
    # N days or N hours after the last successful rotation (immediately due the first time).
    every: 30d
    # cron: "0 3 * * 6"   # evaluated in window.timezone

  # Mandatory change window. A due rotation only starts inside it.
  window:
    timezone: Europe/Istanbul  # IANA name, default: UTC
    days: [Sat, Sun]           # empty: every day
    start: "02:00"
    duration: 3h               # at most 24h
    # Do not start with less than this left in the window. Default: 15m
    minRemaining: 15m

  # How applications receive the password. None: they read Vault directly.
  secretSync:
    type: None

  # Restarted after the new password is in place, like `kubectl rollout restart`.
  # Each entry has exactly one of name or selector.
  restartTargets:
  - kind: Deployment
    name: orders-api
  - kind: StatefulSet
    selector:
      matchLabels:
        app.kubernetes.io/part-of: orders
  - kind: DaemonSet
    name: orders-agent
  # How long to wait for the rollouts. Default: 10m
  rolloutTimeout: 10m
